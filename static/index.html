<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Calificación OMR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #f8fafc;
      --text-main: #0f172a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0 0 35px 0;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      color: var(--text-main);
      min-height: 100vh;
    }
    
    .top-header {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 40%, #3b82f6 75%, #06b6d4 100%);
      color: white;
      padding: 32px 20px 26px;
      text-align: center;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
      margin-bottom: 22px;
    }

    .top-header h1 {
      margin: 0;
      font-size: 1.6em;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .top-header p {
      margin: 6px 0 0;
      font-size: 0.95em;
      color: #fdf2f8;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-live {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 4px 14px;
      border-radius: 14px;
      font-size: 0.75em;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      font-weight: 700;
    }

    .container {
      padding: 0 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px 0;
      font-size: 1.15em;
      font-weight: 800;
      color: var(--text-main);
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .step-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    label {
      display: block;
      margin: 12px 0 5px;
      font-weight: 700;
      font-size: 0.85em;
      color: #475569;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 0.95em;
      transition: all 0.2s;
      background: #f8fafc;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
      background: #ffffff;
    }

    .hint-text {
      display: block;
      margin-top: 4px;
      font-size: 0.76em;
      font-weight: 600;
      color: #7c3aed;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 1em;
      cursor: pointer;
      margin-top: 18px;
      transition: transform 0.1s ease, filter 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-pdf {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: white;
      box-shadow: 0 6px 16px rgba(168, 85, 247, 0.35);
    }

    .btn-camara {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      font-size: 1.08em;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }

    .clave-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      transition: transform 0.15s ease;
    }

    .clave-label {
      font-size: 0.92em;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .opciones-group {
      display: flex;
      gap: 6px;
    }

    .opcion-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border-radius: 9px;
      border: 2px solid transparent;
      background: white;
      font-weight: 800;
      font-size: 0.9em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .res-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .res-item {
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      border: 1.5px solid transparent;
    }

    .res-buenas { background: #ecfdf5; border-color: #6ee7b7; color: #047857; }
    .res-malas { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
    .res-blancas { background: #f8fafc; border-color: #cbd5e1; color: #475569; }
    .res-nota { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }

    .res-num {
      font-size: 1.6em;
      font-weight: 800;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="badge-live">Plataforma Activa</div>
    <h1>Sistema de Calificación OMR</h1>
    <p>Gestión Pedagógica</p>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-title">
        <span class="step-number" style="background: linear-gradient(135deg, #ec4899, #f43f5e);">1</span>
        Configurar Hoja de Respuestas
      </div>
      
      <label>Insignia / Logo (Opcional - JPG o PNG

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Calificación OMR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #f8fafc;
      --text-main: #0f172a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0 0 35px 0;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      color: var(--text-main);
      min-height: 100vh;
    }
    
    .top-header {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 40%, #3b82f6 75%, #06b6d4 100%);
      color: white;
      padding: 32px 20px 26px;
      text-align: center;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
      margin-bottom: 22px;
    }

    .top-header h1 {
      margin: 0;
      font-size: 1.6em;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .top-header p {
      margin: 6px 0 0;
      font-size: 0.95em;
      color: #fdf2f8;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-live {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 4px 14px;
      border-radius: 14px;
      font-size: 0.75em;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      font-weight: 700;
    }

    .container {
      padding: 0 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px 0;
      font-size: 1.15em;
      font-weight: 800;
      color: var(--text-main);
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .step-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    label {
      display: block;
      margin: 12px 0 5px;
      font-weight: 700;
      font-size: 0.85em;
      color: #475569;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 0.95em;
      transition: all 0.2s;
      background: #f8fafc;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
      background: #ffffff;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 1em;
      cursor: pointer;
      margin-top: 18px;
      transition: transform 0.1s ease, filter 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-pdf {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: white;
      box-shadow: 0 6px 16px rgba(168, 85, 247, 0.35);
    }

    .btn-camara {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      font-size: 1.08em;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }

    .clave-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      transition: transform 0.15s ease;
    }

    .clave-label {
      font-size: 0.92em;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .opciones-group {
      display: flex;
      gap: 6px;
    }

    .opcion-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border-radius: 9px;
      border: 2px solid transparent;
      background: white;
      font-weight: 800;
      font-size: 0.9em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .res-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .res-item {
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      border: 1.5px solid transparent;
    }

    .res-buenas { background: #ecfdf5; border-color: #6ee7b7; color: #047857; }
    .res-malas { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
    .res-blancas { background: #f8fafc; border-color: #cbd5e1; color: #475569; }
    .res-nota { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }

    .res-num {
      font-size: 1.6em;
      font-weight: 800;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="badge-live">Plataforma Activa</div>
    <h1>Sistema de Calificación OMR</h1>
    <p>Gestión Pedagógica</p>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-title">
        <span class="step-number" style="background: linear-gradient(135deg, #ec4899, #f43f5e);">1</span>
        Configurar Hoja de Respuestas
      </div>
      
      <label>Insignia / Logo (Opcional - JPG o PNG):</label>
      <input type="file" id="logoColegio" accept="image/png, image/jpeg">

      <label>Nombre de la Institución Educativa:</label>
      <input type="text" id="nombreIE" value="SANTO DOMINGO - LARAOS">

      <div class="grid-2">
        <div>
          <label>Tema / Evento / Concurso:</label>
          <input type="text" id="temaEvaluacion" value="Concurso Escolar 2026">
        </div>
        <div>
          <label>Área / Curso:</label>
          <input type="text" id="areaCurso" value="Comunicación">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Grado y Sección:</label>
          <input type="text" id="gradoSeccion" value="1ero Secundaria">
        </div>
        <div>
          <label>Docente / Responsable:</label>
          <input type="text" id="docenteResp" value="Prof. Responsable">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Número de Preguntas (Máx. 100):</label>
          <input type="number" id="numPreguntas" value="20" min="1" max="100" onchange="renderizarClaveDocente()">
        </div>
        <div>
          <label>Alternativas:</label>
          <select id="tipoOpciones" onchange="renderizarClaveDocente()">
            <option value="ABCD" selected>A, B, C, D (4 alternativas)</option>
            <option value="ABC">A, B, C (3 alternativas)</option>
            <option value="ABCDE">A, B, C, D, E (5 alternativas)</option>
            <option value="VF">V, F (Verdadero / Falso)</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn-pdf" onclick="generarPDF()">Descargar Hoja en PDF</button>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="step-number" style="background: linear-gradient(135deg, #8b5cf6, #6366f1);">2</span>
        Clave del Docente
      </div>
      <div id="contenedorClave"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="step-number" style="background: linear-gradient(135deg, #10b981, #059669);">3</span>
        Calificar Examen
      </div>
      <label>Nombre o Código del Estudiante:</label>
      <input type="text" id="nombreEstudiante" placeholder="Ej. José Ordoñez">

      <input type="file" id="camaraInput" accept="image/*" capture="environment" style="display:none;" onchange="procesarExamen()">
      <button type="button" class="btn-camara" onclick="iniciarCaptura()">📷 Abrir Cámara y Calificar</button>

      <div id="pantallaResultado" style="display:none; margin-top: 18px;">
        <div class="res-grid">
          <div class="res-item res-buenas">
            <span style="font-size:0.8em; font-weight:800;">CORRECTAS</span>
            <span id="resBuenas" class="res-num">0</span>
          </div>
          <div class="res-item res-malas">
            <span style="font-size:0.8em; font-weight:800;">INCORRECTAS</span>
            <span id="resMalas" class="res-num">0</span>
          </div>
          <div class="res-item res-blancas">
            <span style="font-size:0.8em; font-weight:800;">EN BLANCO</span>
            <span id="resBlancas" class="res-num">0</span>
          </div>
          <div class="res-item res-nota">
            <span style="font-size:0.8em; font-weight:800;">NOTA / 20</span>
            <span id="resNota" class="res-num">0</span>
          </div>
        </div>
        <p id="msgSheets" style="font-size:0.95em; text-align:center; color:#334155; margin-top:14px; font-weight:700;"></p>
      </div>
    </div>
  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzjyB6qhdCZGSSdc1l--b7JDckZ7rq8rWCLHe09RaYS0U7ltSQaB-5t2s_UY9Jdwizx/exec";
    let claveDocente = {};

    const PALETA_COLORES = [
      { fondo: "#ede9fe", texto: "#6d28d9", activo: "#7c3aed", borde: "#c4b5fd" },
      { fondo: "#e0f2fe", texto: "#0369a1", activo: "#0284c7", borde: "#7dd3fc" },
      { fondo: "#ecfdf5", texto: "#047857", activo: "#059669", borde: "#6ee7b7" },
      { fondo: "#ffedd5", texto: "#c2410c", activo: "#ea580c", borde: "#fdba74" },
      { fondo: "#fce7f3", texto: "#be185d", activo: "#db2777", borde: "#f9a8d4" },
      { fondo: "#fef3c7", texto: "#b45309", activo: "#d97706", borde: "#fcd34d" },
      { fondo: "#e0e7ff", texto: "#4338ca", activo: "#4f46e5", borde: "#a5b4fc" },
      { fondo: "#cffafe", texto: "#0e7490", activo: "#0891b2", borde: "#67e8f9" },
      { fondo: "#f3e8ff", texto: "#7e22ce", activo: "#9333ea", borde: "#d8b4fe" },
      { fondo: "#ecfccb", texto: "#4d7c0f", activo: "#65a30d", borde: "#bef264" }
    ];

    function renderizarClaveDocente() {
      const num = parseInt(document.getElementById('numPreguntas').value) || 20;
      const ops = document.getElementById('tipoOpciones').value.split('');
      const cont = document.getElementById('contenedorClave');
      cont.innerHTML = '';
      claveDocente = {};

      for (let i = 1; i <= num; i++) {
        claveDocente[i] = ops[0];
        const temaColor = PALETA_COLORES[(i - 1) % PALETA_COLORES.length];

        let row = document.createElement('div');
        row.className = 'clave-row';
        row.style.background = temaColor.fondo;
        row.style.border = `1.5px solid ${temaColor.borde}`;

        row.innerHTML = `
          <span class="clave-label" style="color: ${temaColor.texto};">
            PREG. ${i < 10 ? '0' + i : i}
          </span>
          <div class="opciones-group"></div>
        `;
        
        let divOps = row.querySelector('.opciones-group');

        ops.forEach(op => {
          let b = document.createElement('button');
          b.type = 'button';
          b.className = 'opcion-btn';
          b.innerText = op;

          function aplicarEstilo(btn, seleccionado) {
            if (seleccionado) {
              btn.style.background = temaColor.activo;
              btn.style.color = '#ffffff';
              btn.style.borderColor = temaColor.activo;
              btn.style.boxShadow = `0 3px 8px ${temaColor.borde}`;
            } else {
              btn.style.background = '#ffffff';
              btn.style.color = temaColor.texto;
              btn.style.borderColor = temaColor.borde;
              btn.style.boxShadow = 'none';
            }
          }

          aplicarEstilo(b, op === ops[0]);

          b.onclick = () => {
            divOps.querySelectorAll('.opcion-btn').forEach(btn => aplicarEstilo(btn, false));
            aplicarEstilo(b, true);
            claveDocente[i] = op;
          };

          divOps.appendChild(b);
        });

        cont.appendChild(row);
      }
    }

    function leerImagen(file) {
      return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    async function generarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      const margen = 15;
      const tamCuadro = 10;

      // 4 marcas en esquinas
      doc.setFillColor(0, 0, 0);
      doc.rect(margen, margen, tamCuadro, tamCuadro, "F");
      doc.rect(210 - margen - tamCuadro, margen, tamCuadro, tamCuadro, "F");
      doc.rect(margen, 297 - margen - tamCuadro, tamCuadro, tamCuadro, "F");
      doc.rect(210 - margen - tamCuadro, 297 - margen - tamCuadro, tamCuadro, tamCuadro, "F");

      // Insignia
      const logoInput = document.getElementById('logoColegio');
      if (logoInput.files && logoInput.files[0]) {
        try {
          const imgData = await leerImagen(logoInput.files[0]);
          doc.addImage(imgData, "PNG", 30, 16, 18, 18);
        } catch (e) {
          console.warn("Logo no cargado", e);
        }
      }

      // Encabezado
      const ie = document.getElementById("nombreIE").value;
      const tema = document.getElementById("temaEvaluacion").value;
      const area = document.getElementById("areaCurso").value;
      const grado = document.getElementById("gradoSeccion").value;
      const docente = document.getElementById("docenteResp").value;

      doc.setFontSize(13);
      doc.setFont("helvetica", "bold");
      doc.text(ie.toUpperCase(), 115, 20, { align: "center" });

      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`${tema} — Área: ${area}`, 115, 26, { align: "center" });
      doc.text(`Grado/Sección: ${grado} | Docente: ${docente}`, 115, 31, { align: "center" });

      doc.setDrawColor(180, 180, 180);
      doc.line(30, 34, 180, 34);

      doc.setFontSize(9);
      doc.text("Apellidos y Nombres: ________________________________________________", 30, 40);
      doc.text("DNI / Código: ______________________     Fecha: _____________________", 30, 46);

      // Parámetros dinámicos según cantidad de preguntas
      const num = parseInt(document.getElementById('numPreguntas').value);
      const ops = document.getElementById('tipoOpciones').value.split('');

      let startX, anchoCol, colW, radioBurbuja, fontSizePreg;

      if (num <= 25) {
        startX = 36;
        anchoCol = 0;
        colW = 10.0;
        radioBurbuja = 2.8;
        fontSizePreg = 9;
      } else if (num <= 50) {
        startX = 32.5;
        anchoCol = 80;
        colW = 8.8;
        radioBurbuja = 2.6;
        fontSizePreg = 8.5;
      } else if (num <= 75) {
        startX = 28.5;
        anchoCol = 57;
        colW = 7.1;
        radioBurbuja = 2.2;
        fontSizePreg = 7.5;
      } else {
        startX = 25.0;
        anchoCol = 43;
        colW = 5.55;
        radioBurbuja = 1.9;
        fontSizePreg = 6.5;
      }

      const startY = 56;
      const pasoY = 9.0;

      for (let i = 1; i <= num; i++) {
        let colIdx = Math.floor((i - 1) / 25);
        let filaIdx = (i - 1) % 25;

        let y = startY + (filaIdx * pasoY);
        let x = startX + (colIdx * anchoCol);

        doc.setFontSize(fontSizePreg);
        doc.setFont("helvetica", "bold");
        doc.text(`${i < 10 ? '0' + i : i}.`, x - (radioBurbuja + 2), y + 1.2);

        doc.setFont("helvetica", "normal");
        ops.forEach((letra, idx) => {
          let cx = x + (idx * colW);
          doc.circle(cx, y, radioBurbuja, "S");
          doc.text(letra, cx, y + (radioBurbuja * 0.45), { align: "center" });
        });
      }

      doc.save(`Hoja_Respuestas_${num}P_${area}.pdf`);
    }

    function iniciarCaptura() {
      const nombre = document.getElementById('nombreEstudiante').value.trim();
      if (!nombre) {
        alert("Por favor, ingresa el nombre o código del estudiante antes de escanear.");
        return;
      }
      document.getElementById('camaraInput').click();
    }

    async function procesarExamen() {
      const input = document.getElementById('camaraInput');
      if (!input.files.length) return;

      const pnl = document.getElementById('pantallaResultado');
      const msg = document.getElementById('msgSheets');
      pnl.style.display = 'block';
      msg.innerText = "Procesando imagen con OpenCV...";

      const formData = new FormData();
      formData.append("imagen", input.files[0]);
      formData.append("clave", JSON.stringify(Object.values(claveDocente)));
      formData.append("opciones", JSON.stringify(document.getElementById('tipoOpciones').value.split('')));

      try {
        const resp = await fetch("/api/calificar", { method: "POST", body: formData });
        const data = await resp.json();

        if (data.status === "ok") {
          document.getElementById('resBuenas').innerText = data.buenas;
          document.getElementById('resMalas').innerText = data.malas;
          document.getElementById('resBlancas').innerText = data.blancas;
          document.getElementById('resNota').innerText = data.puntaje;

          msg.innerText = "Guardando nota en Google Sheets...";
          
          await fetch(URL_APPS_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              estudiante: document.getElementById('nombreEstudiante').value.trim(),
              buenas: data.buenas,
              malas: data.malas,
              blancas: data.blancas,
              puntaje: data.puntaje
            })
          });

          msg.innerText = "✓ Calificado y registrado en Google Sheets.";
          document.getElementById('nombreEstudiante').value = "";
        } else {
          alert("Error: " + data.detail);
          msg.innerText = "Error en lectura de imagen.";
        }
      } catch (err) {
        alert("Error de conexión al procesar el examen.");
        msg.innerText = "Error de red.";
      }
    }

    window.onload = renderizarClaveDocente;
  </script>
</body>
</html>
